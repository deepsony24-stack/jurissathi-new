<body>

<h1>JurisSathi Admin Panel</h1>

<h2>Consultation Leads</h2>
  <h3 id="totalLeads">Total Leads: 0</h3>
<div id="leads"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
getFirestore,
collection,
getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyC-5n2B-y4sR_EE8svpsq3LCMJiapJC9Qw",
authDomain: "jurissathi.firebaseapp.com",
projectId: "jurissathi",
storageBucket: "jurissathi.firebasestorage.app",
messagingSenderId: "529261201285",
appId: "1:529261201285:web:529bd38c0ae95654d6e6ec"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function loadLeads(){

const snapshot = await getDocs(collection(db,"consultations"));
document.getElementById("totalLeads").innerText = "Total Leads: " + snapshot.size;
let html = "";

snapshot.forEach(doc=>{

const data = doc.data();
let status = data.status || "New";
html += `
<div class="card">
<h3>${data.name}</h3>
<p>Mobile: ${data.phone}</p>
<p>Case: ${data.caseType}</p>
<p>Date: ${data.preferredDate}</p>
<p>Details: ${data.details}</p>
<p>Status: ${status}</p>

<button onclick="updateStatus('${doc.id}','Contacted')">
Contacted
</button>

<button onclick="updateStatus('${doc.id}','Closed')">
Closed
</button>
<a href="https://wa.me/91${data.phone}?text=${encodeURIComponent('Namaskar, JurisSathi se aapki legal enquiry ke sambandh me sampark kar rahe hain.')}" target="_blank">
  <button>WhatsApp Client</button>
</a>
</div>
`;

});

document.getElementById("leads").innerHTML = html;

}

loadLeads();
    window.updateStatus = async function(id, status){

  alert("Status changed to: " + status);

}

</script>

</body>
</html>
