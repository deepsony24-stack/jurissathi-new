<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>JurisSathi Admin Panel</title>
<style>
body{
font-family:Arial;
background:#111827;
color:white;
padding:20px;
}
.card{
background:#1f2937;
padding:15px;
margin:10px 0;
border-radius:10px;
}
button{
background:#fbbf24;
border:none;
padding:8px 15px;
border-radius:5px;
cursor:pointer;
}
</style>
</head>

<body>
<script>
let password = prompt("Enter Admin Password");

if(password !== "Raj@1402"){
    alert("Access Denied");
    window.location.href="https://jurissathi.com";
}
</script>
<h1>JurisSathi Admin Panel</h1>
<div style="background:#1a2238;padding:15px;border-radius:10px;margin-bottom:20px;">
    <h2>📊 Website Analytics</h2>
    <h3 id="visitorCount">Total Visitors: Loading...</h3>
    <h3 id="todayVisitors">Today Visitors: Loading...</h3>
<h3 id="monthVisitors">Monthly Visitors: Loading...</h3>
</div>
<h2>Consultation Leads</h2>
  <h3 id="totalLeads">Total Leads: 0</h3>
    <h3 id="newLeads">New Leads: 0</h3>
<h3 id="contactedLeads">Contacted: 0</h3>
<h3 id="closedLeads">Closed: 0</h3>
<div id="leads"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  doc,
  getDoc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyC-5n2B-y4sR_EE8svpsq3LCMJiapJC9Qw",
authDomain: "jurissathi.firebaseapp.com",
projectId: "jurissathi",
storageBucket: "jurissathi.firebasestorage.app",
messagingSenderId: "529261201285",
appId: "1:529261201285:web:529bd38c0ae95654d6e6ec"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
async function loadVisitors(){
  const visitorRef = doc(db, "analytics", "visitors");
  const visitorSnap = await getDoc(visitorRef);

  if(visitorSnap.exists()){
    const data = visitorSnap.data();
      document.getElementById("todayVisitors").innerText =
  "Today Visitors: " + (data.todayVisitors || 0);

document.getElementById("monthVisitors").innerText =
  "Monthly Visitors: " + (data.monthVisitors || 0);
    document.getElementById("visitorCount").innerText =
      "Total Visitors: " + data.totalVisitors;
  }
}

loadVisitors();
async function loadLeads(){

const snapshot = await getDocs(collection(db,"consultations"));
document.getElementById("totalLeads").innerText = "Total Leads: " + snapshot.size;
let html = "";
let newCount = 0;
let contactedCount = 0;
let closedCount = 0;
snapshot.forEach(doc=>{

const data = doc.data();
let status = data.status || "New Lead";
    if(status === "New Lead") newCount++;
if(status === "Contacted") contactedCount++;
if(status === "Closed") closedCount++;
html += `
<div class="card">
<h3>${data.name}</h3>
<p>Mobile: ${data.phone}</p>
<p>Case: ${data.caseType}</p>
<p>Date: ${data.preferredDate}</p>
<p>Details: ${data.details}</p>
<p>Status: ${status}</p>

<button onclick="updateStatus('${doc.id}','Contacted')">
Contacted
</button>

<button onclick="updateStatus('${doc.id}','Closed')">
Closed
</button>
<a href="https://wa.me/91${data.phone}?text=${encodeURIComponent('Namaskar, JurisSathi se aapki legal enquiry ke sambandh me sampark kar rahe hain.')}" target="_blank">
  <button>WhatsApp Client</button>
</a>
</div>
`;

});
document.getElementById("newLeads").innerText = "New Leads: " + newCount;
document.getElementById("contactedLeads").innerText = "Contacted: " + contactedCount;
document.getElementById("closedLeads").innerText = "Closed: " + closedCount;
document.getElementById("leads").innerHTML = html;

}
window.updateStatus = async function(id, status){
  await updateDoc(doc(db, "consultations", id), {
    status: status
  });

  alert("Status Updated to " + status);
  location.reload();
}
loadLeads();
    

</script>

</body>
</html>
