let noticeDateFormatted = new Date(noticeDate).toLocaleDateString('en-GB');
   let advName = document.getElementById("advName").value;

 let opponentFather = document.getElementById("opponentFather").value;

let chequeNumber = document.getElementById("chequeNumber").value;

let chequeDate = document.getElementById("chequeDate").value;
let chequeDateFormatted = new Date(chequeDate).toLocaleDateString("en-GB");

let chequeAmount = document.getElementById("chequeAmount").value;

let transactionReason = document.getElementById("transactionReason").value;

let bankName = document.getElementById("bankName").value;
let branchName = document.getElementById("branchName").value;

let presentationDate = document.getElementById("presentationDate").value;
let presentationDateFormatted = new Date(presentationDate).toLocaleDateString("en-GB");

let returnMemoDate = document.getElementById("returnMemoDate").value;
let returnMemoDateFormatted = new Date(returnMemoDate).toLocaleDateString("en-GB");

let dishonourReason = document.getElementById("dishonourReason").value;
  let notice = "";

  if(language === "hindi"){
  notice = `

वविधिक नोटिस

दिनांक: ${noticeDateFormatted}

प्रेषक:

अधिवक्ता ${advName}
${advCourt}

मोबाइल : ${advMobile}

नाम : ${opponent}
पिता/पति का नाम : ${opponentFather}
पता : ${opponentAddress}
मोबाइल नं. : ${opponentMobile}

विषय:

परक्राम्य लिखत अधिनियम, 1881 की धारा 138 के अंतर्गत चेक अनादरण (Cheque Dishonour) के संबंध में विधिक नोटिस।

महोदय/महोदया,

मेरे मुवक्किल के स्पष्ट निर्देशों एवं अधिकार के आधार पर आपको यह विधिक नोटिस प्रेषित किया जा रहा है, जिससे आपको आपके द्वारा उत्पन्न विधिक दायित्वों एवं उनके उल्लंघन के परिणामों से विधिवत अवगत कराया जा सके।

1. कि आपके एवं मेरे मुवक्किल के मध्य ${transactionReason} के संबंध में एक वैध, विधिसम्मत एवं विधिक रूप से प्रवर्तनीय वित्तीय देयता (Legally Enforceable Debt or Liability) विद्यमान थी, जिसका निर्वहन करना आपका वैधानिक दायित्व था।
2. कि उक्त वैध देयता के निर्वहन एवं भुगतान के उद्देश्य से आपने मेरे मुवक्किल के पक्ष में ₹${chequeAmount}/- (रुपये ${chequeAmount} मात्र) का चेक क्रमांक ${chequeNumber}, दिनांक ${chequeDateFormatted}, बैंक ${bankName}, शाखा ${branchName} से जारी किया।
3. कि उपर्युक्त चेक आपने पूर्णतः स्वेच्छा, स्वतंत्र इच्छा एवं बिना किसी दबाव, अनुचित प्रभाव, प्रलोभन अथवा भ्रम के मेरे मुवक्किल को जारी किया था, जिससे आपके द्वारा उक्त वित्तीय देयता को स्वीकार किया जाना स्पष्ट रूप से सिद्ध होता है।
4. कि मेरे मुवक्किल ने उक्त चेक को उसकी वैधानिक वैधता अवधि के भीतर, सद्भावना एवं विधि के अनुरूप दिनांक ${presentationDateFormatted} को अपने बैंक के माध्यम से भुगतान हेतु प्रस्तुत किया।
5. कि उक्त चेक बैंक द्वारा दिनांक ${returnMemoDateFormatted} को "${dishonourReason}" कारण अंकित करते हुए अनादृत (Dishonoured) कर वापस कर दिया गया, जिसकी सूचना बैंक द्वारा जारी Return Memo के माध्यम से मेरे मुवक्किल को प्राप्त हुई।
6. कि बैंक द्वारा जारी उक्त Return Memo चेक अनादरण का प्रथमदृष्टया वैधानिक साक्ष्य है तथा यह स्पष्ट रूप से प्रदर्शित करता है कि आप अपने वैधानिक एवं वित्तीय दायित्वों का निर्वहन करने में विफल रहे हैं।
7. कि आपके द्वारा ऐसा चेक जारी किया जाना, जिसका भुगतान प्रस्तुत किए जाने पर संभव नहीं हो सका, आपके वैधानिक दायित्वों के गंभीर उल्लंघन को दर्शाता है तथा इससे मेरे मुवक्किल को आर्थिक हानि, मानसिक पीड़ा एवं अनावश्यक असुविधा का सामना करना पड़ा है।
8. कि चेक के अनादरण की सूचना प्राप्त होने के उपरांत भी मेरे मुवक्किल ने आपको अनेक अवसरों पर व्यक्तिगत रूप से, दूरभाष, संदेश तथा अन्य उपलब्ध माध्यमों से बकाया राशि का भुगतान करने हेतु अनुरोध किया, तथापि आपने न तो भुगतान किया और न ही कोई संतोषजनक उत्तर अथवा स्पष्टीकरण प्रस्तुत किया।
9. कि आपके उक्त आचरण से यह स्पष्ट रूप से सिद्ध होता है कि आपने अपने वैधानिक एवं संविदात्मक दायित्वों का जानबूझकर उल्लंघन किया है, जिसके परिणामस्वरूप मेरे मुवक्किल को आर्थिक हानि, मानसिक प्रताड़ना, समय की क्षति तथा अनावश्यक विधिक व्यय वहन करना पड़ रहा है।
10. कि आपके द्वारा जारी किया गया उपर्युक्त चेक मेरे मुवक्किल के पक्ष में विद्यमान वैध एवं विधिक रूप से प्रवर्तनीय ऋण/देयता (Legally Enforceable Debt or Liability) के भुगतान हेतु जारी किया गया था। अतः उक्त चेक का अनादरण परक्राम्य लिखत अधिनियम, 1881 की धारा 138 के अंतर्गत दंडनीय अपराध की श्रेणी में आता है।
11. कि यह विधिक नोटिस परक्राम्य लिखत अधिनियम, 1881 की धारा 138 के प्रावधानों के अनुपालन में आपको विधिवत प्रेषित किया जा रहा है तथा आपको अंतिम एवं पर्याप्त अवसर प्रदान किया जाता है कि आप इस नोटिस की प्राप्ति से 15 (पंद्रह) दिवस की वैधानिक अवधि के भीतर ₹${chequeAmount}/- (रुपये __________ मात्र) की संपूर्ण राशि मेरे मुवक्किल को अदा करें।
12. कि यदि आप उपर्युक्त वैधानिक अवधि के भीतर भुगतान करने में विफल रहते हैं, तो मेरे मुवक्किल के पक्ष में आपके विरुद्ध परक्राम्य लिखत अधिनियम, 1881 की धारा 138 के अंतर्गत सक्षम न्यायालय में आपराधिक परिवाद (Criminal Complaint) प्रस्तुत करने का विधिक कारण (Cause of Action) उत्पन्न हो जाएगा।
13. कि उपर्युक्त आपराधिक कार्यवाही के अतिरिक्त मेरे मुवक्किल आपके विरुद्ध मूल राशि की वसूली, विधि एवं तथ्यों के अनुसार देय ब्याज, हर्जाना (Damages), वाद व्यय, अधिवक्ता शुल्क तथा अन्य उपलब्ध दीवानी एवं वैधानिक राहतों की प्राप्ति हेतु पृथक विधिक कार्यवाही प्रारंभ करने का अधिकार सुरक्षित रखते हैं।
14. कि ऐसी समस्त विधिक कार्यवाही सक्षम अधिकारिता (Competent Jurisdiction) वाले न्यायालय के समक्ष प्रारंभ की जाएगी तथा उससे उत्पन्न होने वाले समस्त न्यायालयीन व्यय, अधिवक्ता शुल्क, न्यायालय शुल्क एवं अन्य विधिक परिणामों के लिए आप स्वयं पूर्णतः उत्तरदायी होंगे।
15. कि आपको इस विधिक नोटिस के माध्यम से अंतिम अवसर प्रदान किया जाता है कि आप इस नोटिस की प्राप्ति से 15 (पंद्रह) दिवस के भीतर ₹${chequeAmount}/- (रुपये __________ मात्र) की संपूर्ण राशि मेरे मुवक्किल को अदा कर अपने वैधानिक दायित्व का निर्वहन करें तथा भविष्य में किसी भी प्रकार के अनावश्यक विधिक विवाद से बचें।
16. कि यदि आप उक्त वैधानिक अवधि के भीतर भुगतान करने में असफल रहते हैं, तो मेरे मुवक्किल आपके विरुद्ध परक्राम्य लिखत अधिनियम, 1881 की धारा 138 के अंतर्गत सक्षम न्यायालय में आपराधिक परिवाद प्रस्तुत करने के अतिरिक्त अन्य सभी उपलब्ध विधिक उपचार अपनाने के लिए स्वतंत्र एवं बाध्य होंगे।
17. कि ऐसी स्थिति में मेरे मुवक्किल आपके विरुद्ध मूल राशि, ब्याज (यदि विधि एवं तथ्यों के अनुसार देय हो), हर्जाना (Damages), मेस्ने लाभ (जहाँ लागू हो), वाद व्यय, अधिवक्ता शुल्क तथा अन्य समस्त विधिक व्ययों की वसूली हेतु पृथक दीवानी कार्यवाही प्रारंभ करने का अधिकार भी सुरक्षित रखते हैं।
18. कि आपके द्वारा भुगतान न किए जाने की स्थिति में प्रारंभ की जाने वाली समस्त आपराधिक एवं दीवानी कार्यवाहियों से उत्पन्न होने वाले सभी परिणाम, न्यायालयीन व्यय, अधिवक्ता शुल्क, न्यायालय शुल्क एवं अन्य दायित्वों के लिए आप स्वयं पूर्णतः उत्तरदायी होंगे।
19. कि इस विधिक नोटिस को आपको अंतिम एवं पर्याप्त अवसर प्रदान करने के उद्देश्य से प्रेषित किया जा रहा है। यदि आप इस अवसर का लाभ नहीं उठाते हैं, तो यह माना जाएगा कि आपने अपने विधिक दायित्वों का स्वेच्छा से पालन करने से इंकार कर दिया है।
20. अतः आपको अंतिम रूप से निर्देशित एवं अपेक्षित किया जाता है कि आप इस विधिक नोटिस की प्राप्ति से 15 (पंद्रह) दिवस के भीतर ₹${chequeAmount}/- (रुपये __________ मात्र) की संपूर्ण राशि मेरे मुवक्किल को अदा करें। अन्यथा मेरे मुवक्किल आपके विरुद्ध बिना किसी अन्य सूचना अथवा पत्राचार के परक्राम्य लिखत अधिनियम, 1881 की धारा 138 तथा अन्य लागू विधिक प्रावधानों के अंतर्गत सक्षम न्यायालय में उपयुक्त आपराधिक एवं दीवानी कार्यवाही प्रारंभ करेंगे, जिसकी समस्त जिम्मेदारी, व्यय एवं परिणाम आपके स्वयं के जोखिम, उत्तरदायित्व एवं दायित्व पर होंगे।
