<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Money Recovery Notice Generator</title>
<style>
body{font-family:Arial,sans-serif;background:#0b1220;color:white;padding:20px}

input,textarea,select{
    width:100%;
    padding:12px;
    margin:8px 0;
}

button{
    background:#ff9800;
    color:white;
    border:none;
    padding:12px 20px;
}

#output{
    display:none;
    background:white;
    color:black;
    padding:20px;
}

.row{
    display:flex;
    gap:10px;
    margin-bottom:10px;
}

.row input{
    flex:1;
}
</style>
</head>
<body>

<h1>Money Recovery Notice Generator</h1>

<label>Output Language</label>
<select id="language">
<option value="hindi">Generate in Hindi</option>
<option value="english">Generate in English</option>
</select>
<label>Notice Date</label>
<input type="date" id="noticeDate">
   <input id="clientName" placeholder="Client Name">
   <input id="fatherName" placeholder="Father/Husband Name">
<input id="clientAddress" placeholder="Client Address">
   <input id="mobile" placeholder="Mobile Number">
   <input id="opponentName" placeholder="Opposite Party Name">
   <input id="opponentFather" placeholder="Opposite Party Father/Husband Name">
   <input id="opponentMobile" placeholder="Opposite Party Mobile Number">
   <input id="cashAmount" placeholder="Cash Amount">
<input id="onlineAmount" placeholder="Online / UPI Amount">
<input id="purpose" placeholder="Purpose e.g. Medical Emergency">
<input id="interestRate" placeholder="Interest Rate e.g. 12">
<input id="opponentAddress" placeholder="Opposite Party Address">
<input id="amount" placeholder="Amount">
<label>Loan Date</label>
<input type="date" id="loanDate">

<label>Return Date</label>
<input type="date" id="returnDate">

<button onclick="generateNotice()">Generate Notice</button>
  <button onclick="downloadWord()">Download Word</button>

<button onclick="downloadPDF()">Download PDF</button>

<div id="output"></div>

<script>
function generateNotice(){
  let language = document.getElementById("language").value;
  let noticeDate = document.getElementById("noticeDate").value;
let noticeDateFormatted = new Date(noticeDate).toLocaleDateString('en-GB');
  let client = document.getElementById("clientName").value;
  let father = document.getElementById("fatherName").value;
  let address = document.getElementById("clientAddress").value;
  let mobile = document.getElementById("mobile").value;
  let opponent = document.getElementById("opponentName").value;
  let opponentAddress = document.getElementById("opponentAddress").value;
  let amount = document.getElementById("amount").value;
  let opponentFather = document.getElementById("opponentFather").value;

let opponentMobile = document.getElementById("opponentMobile").value;

let cashAmount = document.getElementById("cashAmount").value;

let onlineAmount = document.getElementById("onlineAmount").value;

let purpose = document.getElementById("purpose").value;

let interestRate = document.getElementById("interestRate").value;
  let loanDate = document.getElementById("loanDate").value;
  let returnDate = document.getElementById("returnDate").value;
  let loanDateFormatted = new Date(loanDate).toLocaleDateString('en-GB');
let returnDateFormatted = new Date(returnDate).toLocaleDateString('en-GB');
  let loan = new Date(loanDate);
let ret = new Date(returnDate);

let diffDays = Math.floor((ret - loan) / (1000 * 60 * 60 * 24));

let returnPeriod = "";

if(diffDays >= 30){
    returnPeriod = Math.floor(diffDays / 30) + " माह";
}else{
    returnPeriod = diffDays + " दिन";
}

  let notice = "";

  if(language === "hindi"){
  notice = `

                               विधिक नोटिस

                                                     दिनांक: ..../..../.......

प्रेषक:

अधिवक्ता ब्रजेश राजोरिया
जिला न्यायालय, ग्वालियर (म.प्र.)
मोबाइल: 7566098001
ईमेल: Brajeshrajoriya9@gmail.com
पता: B-17, गौतम नगर, मुरार, ग्वालियर (म.प्र.)

मेरे मुवक्किल श्री ${client},पुत्र/पति श्री ${father},निवासी ${address},
मोबाइल नं. ${mobile}की ओर से।

प्रति,
श्री ${opponent},पुत्र श्री ${opponentFather}
निवासी- ${opponentAddress}
मोबाइल नं. ${opponentMobile}

विषय: आपके ऊपर देय एवं बकाया राशि रुपये ₹${amount}/- की धनराशि की वापसी, वसूली एवं ब्याज भुगतान हेतु विधिक नोटिस।

महोदय,

मेरे मुवक्किल श्री ${client} के निर्देशानुसार एवं उनकी ओर से आपको यह विधिक नोटिस प्रेषित किया जा रहा है।

1. कि आप एवं मेरे मुवक्किल परस्पर मित्र एवं परिचित रहे हैं तथा आपसी विश्वास एवं मधुर संबंधों के कारण आपने अपने परिवार की ${purpose} बताते हुए मेरे मुवक्किल से आर्थिक सहायता की मांग की थी।

2. कि आपके अनुरोध एवं आश्वासनों पर विश्वास करते हुए मेरे मुवक्किल ने आपको कुल राशि रुपये ₹${amount}/- की धनराशि प्रदान की, जिसमें से राशि रुपये ₹${cashAmount}/- नकद तथा राशि रुपये ₹${onlineAmount}/- आपके द्वारा उपलब्ध कराए गए विभिन्न बैंक खातों/UPI खातों में विभिन्न अवसरों पर आपके निर्देशानुसार हस्तांतरित की गई।

3. कि उक्त धनराशि प्राप्त करते समय आपने मेरे मुवक्किल को यह स्पष्ट आश्वासन दिया था कि आप संपूर्ण राशि ${returnPeriod} की अवधि के भीतर वापस कर देंगे।

4. कि आपके बार-बार अनुरोध, विश्वास दिलाने एवं पारिवारिक आवश्यकता को दृष्टिगत रखते हुए मेरे मुवक्किल ने स्वयं आर्थिक व्यवस्था कर आपको उक्त धनराशि उपलब्ध कराई, जिसके कारण मेरे मुवक्किल को आर्थिक भार वहन करना पड़ रहा है।

5. कि आपके द्वारा प्राप्त उक्त धनराशि देय होने के बावजूद आज दिनांक तक वापस नहीं की गई है तथा दिनांक ${returnDateFormatted} को देय अवधि समाप्त हो जाने के पश्चात भी भुगतान नहीं किया गया है।

6. कि मेरे मुवक्किल द्वारा आपको अनेक बार फोन कॉल, व्यक्तिगत संपर्क, व्हाट्सएप संदेश एवं अन्य माध्यमों से राशि लौटाने हेतु कहा गया, जिस पर आप लगातार भुगतान करने का आश्वासन देते रहे, किन्तु वास्तविक भुगतान नहीं किया।

7. कि प्रत्येक अवसर पर राशि की मांग किए जाने पर आपने अपने दायित्व से इंकार नहीं किया, बल्कि समय-समय पर भुगतान करने का आश्वासन देते रहे, जिससे यह स्पष्ट है कि आपके ऊपर मेरे मुवक्किल की उक्त राशि विधिवत देय एवं बकाया है।

8. कि वर्तमान समय में आप मेरे मुवक्किल के फोन कॉल एवं संदेशों का उत्तर नहीं दे रहे हैं तथा जानबूझकर संपर्क से बच रहे हैं, जिससे यह स्पष्ट परिलक्षित होता है कि आप जानबूझकर अपने वैधानिक दायित्व एवं देनदारी के निर्वहन से बच रहे हैं।

9. कि उक्त लेन-देन एवं देय राशि के संबंध में उपलब्ध बैंकिंग अभिलेख, UPI ट्रांजेक्शन विवरण, इलेक्ट्रॉनिक रिकॉर्ड तथा अन्य साक्ष्य मेरे मुवक्किल के पास सुरक्षित एवं उपलब्ध हैं।

10. कि आपके उक्त कृत्य के कारण मेरे मुवक्किल को अनावश्यक आर्थिक हानि, मानसिक प्रताड़ना एवं असुविधा का सामना करना पड़ रहा है तथा आपके ऊपर मेरे मुवक्किल की कुल ₹${amount}/- की राशि विधिवत देय एवं बकाया है।

11. कि मेरे मुवक्किल उक्त मूलधन राशि ₹${amount}/- पर देय तिथि से वास्तविक भुगतान होने तक ${interestRate}% (प्रतिशत) वार्षिक की दर से ब्याज प्राप्त करने के भी विधिक रूप से अधिकारी हैं।

अतः आपको इस विधिक नोटिस के माध्यम से अंतिम अवसर प्रदान करते हुए निर्देशित किया जाता है कि इस नोटिस की प्राप्ति से 15 (पंद्रह) दिवस के भीतर मेरे मुवक्किल की देय एवं बकाया मूलधन राशि ₹${amount}/- तथा उस पर देय ब्याज का पूर्ण भुगतान करें।

अन्यथा मेरे मुवक्किल आपके विरुद्ध सक्षम न्यायालय के समक्ष धनराशि वसूली वाद (Money Recovery Suit), मूलधन, ब्याज, वाद व्यय, अधिवक्ता शुल्क एवं अन्य उपलब्ध वैधानिक राहत प्राप्त करने हेतु आवश्यक कार्यवाही प्रारंभ करने के लिए बाध्य होंगे, साथ ही आवश्यक होने पर आपके विरुद्ध अन्य उपलब्ध दीवानी एवं विधिक कार्यवाही भी प्रारंभ की जा सकेगी।

जिसकी समस्त जिम्मेदारी, न्यायालयीन व्यय, अधिवक्ता शुल्क एवं परिणाम आपके स्वयं के जोखिम एवं उत्तरदायित्व पर होंगे।

कृपया इस नोटिस को अंतिम अवसर मानते हुए निर्धारित अवधि में भुगतान सुनिश्चित करें।

भवदीय,
Adv. Brajesh Rajoriya
JurisSathi`;
  } else {
    notice = `LEGAL NOTICE

Under instructions from my client ${client},
Father/Husband Name: ${father},
Resident of: ${address},
Mobile: ${mobile}

To,
${opponent}
${opponentAddress}

Subject: Legal Notice for Recovery of Money.

Sir/Madam,

My client advanced an amount of ₹${amount} to you on ${loanDateFormatted}.

You assured repayment on or before ${returnDateFormatted}.

Facts:
${facts}

You are hereby called upon to repay the aforesaid amount immediately, failing which appropriate legal action shall be initiated.

Yours Faithfully,
Adv. Brajesh Rajoriya
JurisSathi`;
  }

  document.getElementById("output").innerText = notice;
  document.getElementById("output").style.display = "block";
}
  function downloadWord() {

let content = document.getElementById("output").innerText;

let blob = new Blob([content], {
type: "application/msword"
});

let link = document.createElement("a");

link.href = URL.createObjectURL(blob);

link.download = "Money_Recovery_Notice.doc";

link.click();
URL.revokeObjectURL(link.href);
}
  function downloadPDF() {

    let content = document.getElementById("output").innerText;

    let printWindow = window.open("", "_blank");

    printWindow.document.write(`
        <html>
        <head>
            <title>Money Recovery Notice</title>
            <style>
                body {
                    font-family: Arial, sans-serif;
                    padding: 40px;
                    line-height: 1.6;
                    white-space: pre-wrap;
                }
            </style>
        </head>
        <body>${content}</body>
        </html>
    `);

    printWindow.document.close();
    printWindow.print();
}
</script>

</body>
</html>
